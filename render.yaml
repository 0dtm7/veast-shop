services:
  - type: web
    name: veast-shop-nsdh
    env: node
    plan: free
    buildCommand: pnpm install
    startCommand: pnpm start
    envVars:
      - key: TELEGRAM_BOT_USERNAME
        value: VEAST_Order_Bot
      - key: PUBLIC_BASE_URL
        value: https://veast-shop-nsdh.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_STATUS_KEY
        sync: false
      - key: VEAST_DB_PATH
        value: data/veast.sqlite
      - key: CDEK_CLIENT_ID
        sync: false
      - key: CDEK_CLIENT_SECRET
        sync: false
      - key: CDEK_API_BASE_URL
        value: https://api.edu.cdek.ru/v2
      - key: CDEK_FROM_CITY
        value: Москва
      - key: CDEK_DEFAULT_LOCATION
        value: Москва
      - key: YANDEX_MAPS_API_KEY
        sync: false
